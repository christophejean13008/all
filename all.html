<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Applications</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1b2d;
    --card-bg: #1a2d45;
    --card-hover: #223556;
    --accent1: #f9c74f;
    --accent2: #90e0ef;
    --accent3: #f07167;
    --accent4: #43aa8b;
    --accent5: #c77dff;
    --accent6: #ff9f1c;
    --accent7: #06d6a0;
    --accent8: #ef476f;
    --accent9: #118ab2;
    --accent10: #ffd166;
    --accent11: #73d2de;
    --text: #e8f4fd;
    --subtext: #8ab4c9;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(144,224,239,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(249,199,79,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(192,125,255,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 28px 20px 10px;
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 4vw, 3rem);
    color: var(--accent1);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 20px rgba(249,199,79,0.4);
  }
  header p {
    color: var(--subtext);
    font-size: 0.95rem;
    margin-top: 4px;
    font-weight: 600;
  }
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px 28px 36px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s ease, background 0.18s ease;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.5s ease both;
  }
  .card:hover {
    transform: translateY(-8px) scale(1.025);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 2px var(--color);
    background: var(--card-hover);
  }
  .card:active { transform: translateY(-2px) scale(0.98); }
  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
  }
  .thumb-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 55%, rgba(10,20,38,0.65));
    z-index: 1;
  }
  .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    transition: transform 0.4s ease;
  }
  .card:hover .thumb { transform: scale(1.06); }
  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .card-body {
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
  }
  .card-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    color: var(--text);
    line-height: 1.2;
  }
  .card-sub {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--color);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .card-arrow {
    margin-top: auto;
    padding-top: 4px;
    font-size: 0.78rem;
    color: var(--subtext);
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    transition: color 0.2s;
  }
  .card:hover .card-arrow { color: var(--color); }
  .card-arrow svg { transition: transform 0.2s; }
  .card:hover .card-arrow svg { transform: translateX(4px); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1)  { animation-delay: 0.05s; }
  .card:nth-child(2)  { animation-delay: 0.10s; }
  .card:nth-child(3)  { animation-delay: 0.15s; }
  .card:nth-child(4)  { animation-delay: 0.20s; }
  .card:nth-child(5)  { animation-delay: 0.25s; }
  .card:nth-child(6)  { animation-delay: 0.30s; }
  .card:nth-child(7)  { animation-delay: 0.35s; }
  .card:nth-child(8)  { animation-delay: 0.40s; }
  .card:nth-child(9)  { animation-delay: 0.45s; }
  .card:nth-child(10) { animation-delay: 0.50s; }
  .card:nth-child(11) { animation-delay: 0.55s; }
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 10px;
    font-size: 0.72rem;
    color: #3a5070;
  }
  @media (max-width: 600px) {
    main { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
    header { padding: 18px 12px 6px; }
    .card-title { font-size: 0.9rem; }
  }

  /* ── Carte vedette ovale (Boussole EBEP) ── */
  .featured-section {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 28px 28px;
    flex-wrap: wrap;
  }
  .card-oval {
    background: var(--card-bg);
    border-radius: 80px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 0 3px #43d9ad;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
    text-decoration: none;
    display: flex;
    flex-direction: row;
    width: min(720px, 96%);
    height: 160px;
    animation: fadeUp 0.5s 0.65s ease both;
    margin-top: 4px;
  }
  .card-oval:hover {
    transform: translateY(-8px) scale(1.022);
    box-shadow: 0 24px 56px rgba(0,0,0,0.55), 0 0 0 3px #43d9ad;
  }
  .card-oval .oval-thumb {
    width: 55%;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .card-oval .oval-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    transition: transform 0.4s ease;
  }
  .card-oval:hover .oval-thumb img { transform: scale(1.06); }
  .card-oval .oval-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, transparent 70%, rgba(26,45,69,0.9));
  }
  .card-oval .oval-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 28px 20px 16px;
    gap: 6px;
  }
  .card-oval .oval-badge {
    font-size: 0.68rem;
    font-weight: 800;
    color: #43d9ad;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .card-oval .oval-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.25rem;
    color: var(--text);
    line-height: 1.2;
  }
  .card-oval .oval-sub {
    font-size: 0.72rem;
    color: var(--subtext);
    font-weight: 600;
    line-height: 1.4;
  }
  .card-oval .oval-arrow {
    margin-top: 8px;
    font-size: 0.78rem;
    color: #43d9ad;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 700;
    transition: gap 0.2s;
  }
  .card-oval:hover .oval-arrow { gap: 9px; }
  @media (max-width: 600px) {
    .card-oval { height: auto; min-height: 120px; border-radius: 40px; }
    .card-oval .oval-thumb { width: 42%; }
    .card-oval .oval-title { font-size: 1rem; }
  }
  /* ── Vignette YouTube fixe ── */
  .yt-vignette {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
    flex-shrink: 0;
  }
  .yt-vignette:hover { transform: scale(1.08) translateY(-4px); }
  .yt-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.65rem;
    font-weight: 800;
    color: #fff;
    background: #ff0000;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .yt-thumb {
    position: relative;
    width: 130px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #ff0000;
  }
  .yt-thumb img {
    width: 100%;
    display: block;
  }
  .yt-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.3);
  }
  .yt-play svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  /* ── Compteur de visites ── */
  .visit-counter {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: rgba(26,45,69,0.92);
    border: 1px solid rgba(249,199,79,0.35);
    border-radius: 12px;
    padding: 7px 14px 8px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .visit-counter .vc-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.58rem;
    font-weight: 800;
    color: var(--subtext);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }
  .visit-counter .vc-number {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--accent1);
    line-height: 1;
    letter-spacing: 0.05em;
    min-width: 52px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="visit-counter">
  <span class="vc-label">👁 visites</span>
  <span class="vc-number" id="vc-num">…</span>
</div>

<script>
// GoatCounter — affichage du compteur via l'endpoint public /counter/
(async function() {
  const el = document.getElementById('vc-num');
  if (!el) return;
  try {
    const r = await fetch(
      'https://chris333j.goatcounter.com/counter/%2Fall%2Fall.html.json',
      { cache: 'no-store' }
    );
    if (r.ok) {
      const d = await r.json();
      const raw = String(d.count_unique ?? d.count ?? '0').replace(/\s/g, '');
      const n = parseInt(raw, 10);
      el.textContent = isNaN(n) ? '0' : n.toLocaleString('fr-FR');
      return;
    }
  } catch(e) {}
  el.textContent = '—';
})();
</script>
